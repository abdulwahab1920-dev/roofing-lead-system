name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [production-hardening, free-tier-postgres-resend]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roofing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d roofing_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/roofing_test
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update and install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: |
          find . -path ./node_modules -prune -o -name '*.js' -type f -print0 | xargs -0 -n1 node --check
      - name: Run production smoke test
        run: npm test
