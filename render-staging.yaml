services:
  - type: web
    name: roofing-crm-staging
    runtime: node
    plan: free
    region: oregon
    repo: https://github.com/abdulwahab1920-dev/roofing-lead-system
    branch: form-design-upload
    buildCommand: npm install
    startCommand: npm start
    autoDeployTrigger: off
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: roofing-crm-staging-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: stagingadmin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: COMPANY_NAME
        value: Artific Creations Demo
      - key: APP_TIMEZONE
        value: America/Denver
      - key: DEMO_MODE
        value: "true"
      - key: NODE_ENV
        value: production

databases:
  - name: roofing-crm-staging-db
    plan: free
    region: oregon
    postgresMajorVersion: "18"
    databaseName: roofing_crm_staging_db
    user: roofing_crm_staging_db_user
    connectionPool: none
